
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शुभ दीपावली - सुजाता गोरे</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #301044, #080014 65%, #000);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.main {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
}

.diya {
  font-size: 75px;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { filter: drop-shadow(0 0 8px orange); }
  to { filter: drop-shadow(0 0 28px gold); }
}

h1 {
  font-size: clamp(35px, 9vw, 60px);
  color: gold;
  text-shadow: 0 0 15px orange, 0 0 30px gold;
  margin: 15px 0;
}

h2 {
  color: #ffe4a6;
  margin: 10px;
}

.name {
  font-size: clamp(32px, 8vw, 48px);
  color: #ffb6f2;
  text-shadow: 0 0 20px #ff00cc;
  margin: 20px 0;
}

.message {
  font-size: 18px;
  line-height: 1.9;
  color: #fff0d0;
  max-width: 430px;
}

button {
  padding: 12px 19px;
  margin: 8px;
  border: 1px solid gold;
  border-radius: 30px;
  background: linear-gradient(45deg, #8b3b00, #d99b00);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 12px #ffae00;
}

.footer {
  margin-top: 35px;
  padding: 20px 10px;
  color: #ffe8a6;
  line-height: 1.8;
  text-shadow: 0 0 10px orange;
}

.footer p { margin: 5px; }
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="main">
  <div class="diya">🪔</div>

  <h1>शुभ दीपावली!</h1>
  <h2>प्रकाशाचा सण, आनंदाचा सण</h2>

  <div class="name">सुजाता गोरे</div>

  <div class="message">
    ✨ तुमच्या जीवनात सुख, समृद्धी आणि आनंदाची
    रोषणाई सदैव राहो! ✨
    <br>
    🪔 ही दिवाळी तुमच्यासाठी मंगलमय जावो! 🪔
  </div>

  <div style="margin-top:25px">
    <button onclick="toggleMusic()" id="musicBtn">🎵 Music ON</button>
    <button onclick="toggleFireworkSound()" id="soundBtn">🔊 Firecracker Sound ON</button>
    <button onclick="burst()">🎆 फटाके उडवा!</button>
  </div>

  <div class="footer">
    <p>💐 गोरे परिवाराकडून 💐</p>
    <p>तुम्हाला व तुमच्या परिवाराला</p>
    <p>दीपावलीच्या हार्दिक शुभेच्छा! 🪔</p>
    <p>✨ आपले जीवन आनंदाने उजळून निघो! ✨</p>
  </div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

// फटाक्यांचा आवाज
let soundAudio;
let soundOn = false;

async function toggleFireworkSound() {
  if (!soundAudio) {
    soundAudio = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (soundAudio.state === "suspended") {
    await soundAudio.resume();
  }

  soundOn = !soundOn;

  document.getElementById("soundBtn").innerText =
    soundOn ? "🔇 Firecracker Sound OFF" : "🔊 Firecracker Sound ON";
}

function playFireworkSound() {
  if (!soundOn || !soundAudio) return;

  const osc = soundAudio.createOscillator();
  const gain = soundAudio.createGain();

  osc.type = "triangle";
  osc.frequency.setValueAtTime(150, soundAudio.currentTime);
  osc.frequency.exponentialRampToValueAtTime(35, soundAudio.currentTime + 0.18);

  gain.gain.setValueAtTime(0.4, soundAudio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, soundAudio.currentTime + 0.2);

  osc.connect(gain);
  gain.connect(soundAudio.destination);

  osc.start();
  osc.stop(soundAudio.currentTime + 0.2);
}

// फटाक्यांची आतषबाजी
function burst(x, y) {
  x = x ?? Math.random() * W;
  y = y ?? Math.random() * H * 0.65;

  if (soundOn) playFireworkSound();

  let hue = Math.random() * 360;

  for (let i = 0; i < 80; i++) {
    let angle = Math.PI * 2 * i / 80;
    let speed = Math.random() * 5 + 1;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      hue,
      size: Math.random() * 3 + 1
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.025;
    p.life -= 0.012;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},100%,60%,${p.life})`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsl(${p.hue},100%,60%)`;
    ctx.fill();

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

animate();

setInterval(() => burst(), 950);

// बॅकग्राउंड म्युझिक
let audio = null;
let timer = null;
let playing = false;
let index = 0;

const notes = [
  523,659,784,659,587,698,880,698,
  523,659,784,1047,880,784,659,523
];

function playNote() {
  if (!playing || !audio) return;

  let osc = audio.createOscillator();
  let gain = audio.createGain();

  osc.type = "sine";
  osc.frequency.value = notes[index++ % notes.length];

  gain.gain.setValueAtTime(0.001, audio.currentTime);
  gain.gain.linearRampToValueAtTime(0.07, audio.currentTime + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.45);

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime + 0.5);
}

async function toggleMusic() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (audio.state === "suspended") await audio.resume();

  playing = !playing;

  if (playing) {
    playNote();
    timer = setInterval(playNote, 500);
    document.getElementById("musicBtn").innerText = "🔇 Music OFF";
  } else {
    clearInterval(timer);
    document.getElementById("musicBtn").innerText = "🎵 Music ON";
  }
}
</script>

</body>
</html>
